services:
  # PHP Application
  dev_app:
    build: ./docker/php
    container_name: dev_jrspice_app
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - dev_db
    networks:
      - dev_appnet
      - nginx-proxy
    mem_limit: 1G

  # Queue Worker
  dev_worker:
    build: ./docker/php
    container_name: dev_jrspice_worker
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: [ "sh", "-c", "php artisan queue:work --timeout=3600 --tries=3 & php artisan schedule:work" ]
    depends_on:
      - dev_app
      - dev_db
    networks:
      - dev_appnet
    mem_limit: 512M

  # Nginx Web Server
  dev_web:
    image: nginx:stable-alpine
    container_name: dev_jrspice_web
    restart: unless-stopped
    depends_on:
      - dev_app
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=dev.jrspice.com
      - LETSENCRYPT_HOST=dev.jrspice.com
      - LETSENCRYPT_EMAIL=davi.wordpress@gmail.com
    expose:
      - "80"
    networks:
      - dev_appnet
      - nginx-proxy
    mem_limit: 128M

  # MariaDB Database - APONTANDO PARA O BANCO COM DADOS
  dev_db:
    image: mariadb:10.11
    container_name: dev_jrspice_db
    restart: unless-stopped
    command: [ "mysqld", "--innodb-buffer-pool-size=256M", "--performance-schema=OFF", "--max-connections=100" ]
    environment:
      MYSQL_DATABASE: dev-jrspice-power-bi
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # AQUI ESTÁ O SEU BANCO ORIGINAL:
      - dev-jrspice_dbdata_dev:/var/lib/mysql
    networks:
      - dev_appnet
    mem_limit: 512M

networks:
  dev_appnet:
    external: true
  nginx-proxy:
    external: true

volumes:
  # DECLARANDO O VOLUME COMO EXTERNO PARA NÃO RESETAR
  dev-jrspice_dbdata_dev:
    external: true
