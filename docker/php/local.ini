; --- Configuracoes de Recursos ---
; Documentos de contrato (video ate 5 GB). O PHP grava em arquivo temporario
; em vez de memoria, por isso o memory_limit nao precisa acompanhar.
upload_max_filesize = 5120M
post_max_size = 5120M
memory_limit = 1G

; --- Seguranca (CVE-2026-109619) ---
; O progresso de upload em sessao mantem estado global entre requisicoes no
; mesmo worker, que e exatamente o caminho explorado pela falha. A aplicacao
; nao usa esse recurso (o progresso de upload e feito no navegador).
session.upload_progress.enabled = 0

; --- OPcache Core ---
[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Validacao Freq=0 eh bom para dev em prod use 2 ou 60
opcache.revalidate_freq=0
opcache.validate_timestamps=1
opcache.fast_shutdown=1

; --- JIT performance maxima ---
; Isso vai acelerar os calculos dos dashboards e relatorios
opcache.jit_buffer_size=100M
opcache.jit=tracing

; --- Otimizacao Extra para Laravel ---
opcache.save_comments=1
opcache.enable_file_override=1