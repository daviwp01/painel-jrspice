server {
    listen 80;
    server_name painel.jrspice.com;
    return 301 https://painel.xpiceconnections.com$request_uri;
}

server {
    listen 80;
    server_name painel.xpiceconnections.com;
    root /var/www/html/public;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

    # Gzip Compression (High performance delivery for JS/CSS)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Assets Cache (Instant browser caching for build assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass painel-jrspice_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Evita erros 502 "upstream sent too big header"
        fastcgi_buffer_size 512k;
        fastcgi_buffers 16 512k;
        fastcgi_busy_buffers_size 512k;

        # Timeout para long-polling/fila
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Protege arquivos ocultos
    location ~ /\.ht {
        deny all;
    }
}