server {
    listen 80;
    server_name dev.jrspice.com;
    root /var/www/html/public;
    
    # Mantive os 50M para seus arquivos pesados
    client_max_body_size 50M; 

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

    # --- MELHORIA 1: Compressão Gzip (Reduz latência nos Dashboards) ---
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- MELHORIA 2: Cache de Assets (Tira carga do PHP/CPU) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass dev_app:9000; 
        
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # --- MELHORIA 3: Buffers Ajustados (Evita I/O wait na CPU) ---
        # Aumentei o busy_buffer para 1M para casar com os 16x512k (8MB total)
        fastcgi_buffer_size 512k;
        fastcgi_buffers 16 512k;
        fastcgi_busy_buffers_size 1M;
        fastcgi_temp_file_write_size 1M;

        # Timeouts de 10 minutos (600s) mantidos conforme sua necessidade
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 600;
        
        # Desativa o log de erros de scripts para não inundar o disco
        fastcgi_intercept_errors off;
    }

    location ~ /\.ht {
        deny all;
    }
}